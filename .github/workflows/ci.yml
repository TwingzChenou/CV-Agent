name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: CI - Run Pytest Suite
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Run tests with pytest
      env:
        PYTHONPATH: backend
      run: |
        pytest backend/tests/ -v

  deploy:
    name: CD - Deploy to Production (Render)
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
    - name: Trigger Render Deploy Webhook
      env:
        RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      run: |
        if [ -z "$RENDER_DEPLOY_HOOK" ]; then
          echo "WARNING: RENDER_DEPLOY_HOOK secret is not configured in GitHub repository. Skipping deploy step."
          echo "Please add RENDER_DEPLOY_HOOK to your repository secrets."
          exit 0
        fi
        echo "Triggering deployment on Render..."
        curl -f -X POST "$RENDER_DEPLOY_HOOK"
        echo "Deployment hook triggered successfully!"
